name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [auto-login, disable-pcdn, luogu-helper]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: source/${{ matrix.project }}
        run: npm ci

      - name: Build
        working-directory: source/${{ matrix.project }}
        run: npm run build

      - name: Check dist is up to date
        run: |
          if ! git diff --quiet -- source/${{ matrix.project }}/dist; then
            echo "::error::dist/ is out of date. Run the build locally and commit the result."
            git --no-pager diff -- source/${{ matrix.project }}/dist
            exit 1
          fi
