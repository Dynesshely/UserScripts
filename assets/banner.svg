<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="UserScripts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94a3b8" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <g transform="translate(1010,70)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 130 -70; -90 50; 0 0" keyTimes="0; 0.35; 0.7; 1" dur="10s" repeatCount="indefinite"/>
      <circle r="300" fill="url(#glowBlue)">
        <animateTransform attributeName="transform" type="scale" values="1; 1.45; 0.82; 1" keyTimes="0; 0.35; 0.7; 1" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55; 1; 0.5; 0.55" keyTimes="0; 0.35; 0.7; 1" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g transform="translate(170,330)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -110 -40; 90 55; 0 0" keyTimes="0; 0.4; 0.75; 1" dur="13s" repeatCount="indefinite" begin="-4s"/>
      <circle r="260" fill="url(#glowPurple)">
        <animateTransform attributeName="transform" type="scale" values="1; 1.4; 0.85; 1" keyTimes="0; 0.4; 0.75; 1" dur="13s" repeatCount="indefinite" begin="-4s"/>
        <animate attributeName="opacity" values="0.6; 1; 0.55; 0.6" keyTimes="0; 0.4; 0.75; 1" dur="13s" repeatCount="indefinite" begin="-4s"/>
      </circle>
    </g>
  </g>

  <g transform="translate(720,20)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 120 60; -100 -30; 0 0" keyTimes="0; 0.4; 0.75; 1" dur="11s" repeatCount="indefinite" begin="-7s"/>
      <circle r="220" fill="url(#glowCyan)">
        <animateTransform attributeName="transform" type="scale" values="1; 1.5; 0.8; 1" keyTimes="0; 0.4; 0.75; 1" dur="11s" repeatCount="indefinite" begin="-7s"/>
        <animate attributeName="opacity" values="0.5; 0.95; 0.45; 0.5" keyTimes="0; 0.4; 0.75; 1" dur="11s" repeatCount="indefinite" begin="-7s"/>
      </circle>
    </g>
  </g>

  <g transform="translate(1210,240)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -90 30; 60 -50; 0 0" keyTimes="0; 0.45; 0.8; 1" dur="15s" repeatCount="indefinite" begin="-2s"/>
      <circle r="200" fill="url(#glowPink)">
        <animateTransform attributeName="transform" type="scale" values="1; 1.35; 0.9; 1" keyTimes="0; 0.45; 0.8; 1" dur="15s" repeatCount="indefinite" begin="-2s"/>
        <animate attributeName="opacity" values="0.45; 0.9; 0.5; 0.45" keyTimes="0; 0.45; 0.8; 1" dur="15s" repeatCount="indefinite" begin="-2s"/>
      </circle>
    </g>
  </g>

  <rect x="-52" y="170" width="1384" height="170" fill="url(#dots)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 52 0" dur="12s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.1">
    <animateTransform attributeName="transform" type="translate" values="-500 0; 1720 0" dur="7s" repeatCount="indefinite"/>
    <rect x="0" y="-170" width="240" height="680" fill="url(#sweep)" transform="rotate(-18 120 170)"/>
  </g>

  <g transform="translate(1004,44) scale(0.44)" opacity="0.95">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -18; 0 0" keyTimes="0; 0.5; 1" dur="6s" repeatCount="indefinite"/>
      <g fill="none" stroke="url(#key)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="196" cy="196" r="72"/>
        <path d="M248 248 L392 392"/>
        <path d="M330 330 L378 282"/>
        <path d="M374 374 L422 326"/>
      </g>
    </g>
  </g>

  <text x="72" y="152" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1" fill="#f8fafc">UserScripts</text>
  <text x="74" y="198" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94a3b8">开源用户脚本合集 · 每个脚本独立构建、自动发布</text>

  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e2e8f0">
    <rect x="72" y="238" width="158" height="42" rx="21" fill="url(#pill)" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="151" y="264" text-anchor="middle">Auto Login</text>

    <rect x="244" y="238" width="280" height="42" rx="21" fill="url(#pill)" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="384" y="264" text-anchor="middle">Disable Websites' PCDN</text>

    <rect x="538" y="238" width="130" height="42" rx="21" fill="url(#pill)" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="603" y="264" text-anchor="middle">洛谷助手</text>

    <rect x="682" y="238" width="250" height="42" rx="21" fill="url(#pill)" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="807" y="264" text-anchor="middle">DeepSeek Ctrl+Enter</text>
  </g>

  <text x="1208" y="318" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b">GitHub · GreasyFork · CI/CD</text>
</svg>
