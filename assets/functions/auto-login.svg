<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Auto Login">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="ACCENT_A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="ACCENT_A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1000" height="220" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="220" fill="url(#card)"/>
    <circle cx="930" cy="30" r="200" fill="url(#glow)"/>
    <g transform="translate(48,62)">
      <rect width="96" height="96" rx="24" fill="url(#accent)" fill-opacity="0.16" stroke="#2563eb" stroke-opacity="0.45"/>
      <g transform="translate(24,24)">
        <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="20" cy="20" r="11"/>
          <path d="M28 28 L40 40"/>
          <path d="M34 34 L39 29"/>
          <path d="M38 38 L43 33"/>
        </g>
      </g>
    </g>
    <text x="176" y="86" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Auto Login</text>
    <text x="176" y="120" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#94a3b8">在浏览器里保存站点账号密码，打开登录页时自动填充并提交</text>
    <text x="176" y="146" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#94a3b8">内置 1Panel / JumpServer / DataEase / Portainer / OMV / TrueNAS</text>
    <rect x="190" y="172" width="84" height="30" rx="15" fill="url(#accent)" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.35"/>
    <text x="232" y="192" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">示教模式</text>
    <rect x="284" y="172" width="98" height="30" rx="15" fill="url(#accent)" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.35"/>
    <text x="333" y="192" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">两步式登录</text>
    <rect x="392" y="172" width="84" height="30" rx="15" fill="url(#accent)" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.35"/>
    <text x="434" y="192" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">本机存储</text>
  </g>
</svg>
