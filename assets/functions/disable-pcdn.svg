<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Disable Websites' PCDN">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="ACCENT_A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="ACCENT_A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1000" height="220" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="220" fill="url(#card)"/>
    <circle cx="930" cy="30" r="200" fill="url(#glow)"/>
    <g transform="translate(48,62)">
      <rect width="96" height="96" rx="24" fill="url(#accent)" fill-opacity="0.16" stroke="#ef4444" stroke-opacity="0.45"/>
      <g transform="translate(24,24)">
        <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 8 L40 14 V24 C40 34 24 42 24 42 C24 42 8 34 8 24 V14 Z"/>
          <path d="M16 18 L32 30"/>
        </g>
      </g>
    </g>
    <text x="176" y="86" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Disable Websites' PCDN</text>
    <text x="176" y="120" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#94a3b8">删除页面的 WebRTC / DataChannel 构造器</text>
    <text x="176" y="146" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="14" fill="#94a3b8">阻止网站把访问者当作 PCDN 上传节点</text>
    <rect x="190" y="172" width="224" height="30" rx="15" fill="url(#accent)" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.35"/>
    <text x="302" y="192" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">*.bilibili.com</text>
    <rect x="424" y="172" width="112" height="30" rx="15" fill="url(#accent)" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.35"/>
    <text x="480" y="192" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">WebRTC</text>
    <rect x="546" y="172" width="70" height="30" rx="15" fill="url(#accent)" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.35"/>
    <text x="581" y="192" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">零依赖</text>
  </g>
</svg>
